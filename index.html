<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale/user-scalable are deliberately present, at explicit
      request. They are the first line: a browser that honours them blocks
      zoom before any JavaScript has parsed. src/pwa/preventPinchZoom.ts is
      the second line, covering the browsers that ignore the tag outright
      (Samsung Internet confirmed; recent Safari and Chrome for some users),
      which is why both exist rather than either alone.

      The cost is a real one and is accepted, not overlooked: axe reports a
      meta-viewport violation on every screen for this tag. That is the same
      knowing WCAG 1.4.4 trade-off already made for the JS blocker, so
      e2e/a11y.spec.ts excludes that single rule and keeps checking
      everything else, rather than the suite sitting red or the whole
      accessibility check being switched off.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#131313" />
    <meta name="description" content="gguf-pwa - run local LLMs entirely on your device" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="gguf-pwa" />
    <!--
      CSP: wasm-unsafe-eval is required for WASM instantiation (wllama). No other eval surface
      is permitted. connect-src is limited to self and the Hugging Face hosts that serve GGUF
      weights and their CDN redirect target - the same huggingface.co entry also covers the
      live model-search API calls (api/models), which needs no separate host and no proxy since
      HF reflects the request's Origin as Access-Control-Allow-Origin (verified with curl).
      https://gguf-proxy.feeds-pwa.workers.dev https://text.pollinations.ai https://prexzyapis.com is substituted at build time by vite.config.ts from REMOTE_API_HOSTS
      in src/types/remote.ts, so the one list governs the CSP, the SW, and the Settings
      validation instead of three copies drifting apart. Those hosts are reachable only while
      the optional online API is switched on; the local path still sends nothing.
      worker-src allows blob: because wllama's
      ModelManager and its inference worker are both instantiated from blob: URLs (bundler
      output), confirmed by a CSP violation caught in Playwright before this was added. GitHub
      Pages cannot set response headers, so this is delivered by meta tag (P1-T11, P7-T1).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self' https://huggingface.co https://*.hf.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.huggingface.co https://gguf-proxy.feeds-pwa.workers.dev https://text.pollinations.ai https://prexzyapis.com;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';"
    />
    <!-- Relative, not root-absolute: the dev server prepends `base` to
         root-absolute hrefs, which would turn these into /gguf-pwa/gguf-pwa/...
         apple-touch-icon MUST be a PNG. iOS ignores an SVG here, and with no
         usable icon declared Safari falls back to /apple-touch-icon.png at the
         ORIGIN root - which on a github.io account is whatever another project
         published there, so this app showed a different app's icon on the iOS
         home screen. Regenerate all of these with scripts/generate-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Inline so first paint never waits on a stylesheet request. The
         boot block below is painted straight from this, giving a real
         First Contentful Paint before the React bundle is parsed - a
         client-rendered SPA otherwise shows an empty canvas until then,
         which is exactly what Lighthouse measured. -->
    <style>
      body{margin:0;background:#131313;color:#f5f5f5;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}
      #boot{display:flex;min-height:100dvh;align-items:center;justify-content:center;flex-direction:column;gap:12px}
      #boot p{margin:0;font-size:15px;letter-spacing:-0.01em}
      #boot small{color:#999}
      @media (prefers-reduced-motion:no-preference){
        #boot p{animation:boot-fade .4s ease-out both}
        @keyframes boot-fade{from{opacity:0}to{opacity:1}}
      }
    </style>
    <title>gguf-pwa</title>
    <script type="module" crossorigin src="/gguf-pwa/assets/index-C8EWk6uL.js"></script>
    <link rel="modulepreload" crossorigin href="/gguf-pwa/assets/rolldown-runtime-Bh1tDfsg.js">
    <link rel="modulepreload" crossorigin href="/gguf-pwa/assets/framework-BuQ5xrWZ.js">
    <link rel="modulepreload" crossorigin href="/gguf-pwa/assets/wllama-ECqYUc-E.js">
    <link rel="stylesheet" crossorigin href="/gguf-pwa/assets/framework-DnDzd1rn.css">
    <link rel="stylesheet" crossorigin href="/gguf-pwa/assets/index-72DvibX_.css">
  </head>
  <body>
    <!-- React replaces this subtree on mount (createRoot clears its
         container), so it needs no teardown of its own. -->
    <div id="root">
      <div id="boot">
        <p>gguf-pwa</p>
        <small>Starting on-device model runtime…</small>
      </div>
    </div>
  </body>
</html>
