    <!--
      CSP: wasm-unsafe-eval is required for WASM instantiation (wllama). No other eval surface
      is permitted. connect-src is limited to self and the Hugging Face hosts that serve GGUF
      weights and their CDN redirect target - the same huggingface.co entry also covers the
      live model-search API calls (api/models), which needs no separate host and no proxy since
      HF reflects the request's Origin as Access-Control-Allow-Origin (verified with curl).
      worker-src allows blob: because wllama's
      ModelManager and its inference worker are both instantiated from blob: URLs (bundler
      output), confirmed by a CSP violation caught in Playwright before this was added. GitHub
      Pages cannot set response headers, so this is delivered by meta tag (P1-T11, P7-T1).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self' data:;
        connect-src 'self' https://huggingface.co https://*.hf.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.huggingface.co;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';"
    />
    <!-- Relative, not root-absolute: the dev server prepends `base` to
         root-absolute hrefs, which would turn these into /gguf-pwa/gguf-pwa/... -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
